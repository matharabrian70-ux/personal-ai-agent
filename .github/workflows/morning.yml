name: Morning Agent

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning agent
        env:
          AGENT_URL: https://personal-ai-agent-gova.onrender.com/admin/run-morning
          AGENT_TRIGGER_TOKEN: ${{ secrets.AGENT_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AGENT_TRIGGER_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST "$AGENT_URL" \
            -H "Authorization: Bearer $AGENT_TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}'
